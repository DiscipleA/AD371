worker_processes 2;
worker_shutdown_timeout 5s;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    server_tokens off;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    # An exact allowlist, not origin reflection. CORS is not authorization.
    map $http_origin $cors_origin {
        default "";
        "http://127.0.0.1:8785" "http://127.0.0.1:8785";
        "http://localhost:8785" "http://localhost:8785";
        "https://chernichenkodmitriy.com" "https://chernichenkodmitriy.com";
        "https://www.chernichenkodmitriy.com" "https://www.chernichenkodmitriy.com";
    }
    map "$request_method:$cors_origin" $approved_preflight {
        default 0;
        ~^OPTIONS:.+ 1;
    }
    limit_req_zone $binary_remote_addr zone=quotes:1m rate=10r/s;

    # Equal weights and the default round-robin algorithm, shared across workers.
    upstream stores {
        zone stores 64k;
        server store-a:3000 resolve max_fails=1 fail_timeout=2s;
        server store-b:3000 resolve max_fails=1 fail_timeout=2s;
        keepalive 16;
    }
    upstream store_a_probe {
        zone store_a_probe 32k;
        server store-a:3000 resolve;
    }
    upstream store_b_probe {
        zone store_b_probe 32k;
        server store-b:3000 resolve;
    }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 1k;
        client_body_timeout 3s;
        client_header_timeout 5s;
        send_timeout 5s;
        keepalive_timeout 5s;
        limit_req_status 429;
        add_header X-Lab-Gateway nginx always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Expose-Headers "X-Store-Id, X-Lab-Gateway" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary Origin always;
        add_header Allow "GET, HEAD, OPTIONS" always;

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        if ($approved_preflight = 1) { return 204; }
        if ($request_method = OPTIONS) { return 403; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_next_upstream_timeout 4s;
        proxy_next_upstream_tries 2;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_buffering on;
        proxy_cache off;
        # Preserve the backend's already-sanitized JSON/plain errors.
        proxy_intercept_errors off;

        # Errors have explicit original statuses, safe JSON, gateway/no-store metadata.
        error_page 400 = @gateway_400;
        location @gateway_400 {
            default_type application/json;
            return 400 '{"error":"Request could not be completed"}';
        }
        error_page 403 = @gateway_403;
        location @gateway_403 {
            default_type application/json;
            return 403 '{"error":"Request could not be completed"}';
        }
        error_page 404 = @gateway_404;
        location @gateway_404 {
            default_type application/json;
            return 404 '{"error":"Request could not be completed"}';
        }
        error_page 405 = @gateway_405;
        location @gateway_405 {
            default_type application/json;
            return 405 '{"error":"Request could not be completed"}';
        }
        error_page 408 = @gateway_408;
        location @gateway_408 {
            default_type application/json;
            return 408 '{"error":"Request could not be completed"}';
        }
        error_page 413 = @gateway_413;
        location @gateway_413 {
            default_type application/json;
            return 413 '{"error":"Request could not be completed"}';
        }
        error_page 414 = @gateway_414;
        location @gateway_414 {
            default_type application/json;
            return 414 '{"error":"Request could not be completed"}';
        }
        error_page 429 = @gateway_429;
        location @gateway_429 {
            default_type application/json;
            return 429 '{"error":"Request could not be completed"}';
        }
        error_page 500 = @gateway_500;
        location @gateway_500 {
            default_type application/json;
            return 500 '{"error":"Request could not be completed"}';
        }
        error_page 502 = @gateway_502;
        location @gateway_502 {
            default_type application/json;
            return 502 '{"error":"Request could not be completed"}';
        }
        error_page 503 = @gateway_503;
        location @gateway_503 {
            default_type application/json;
            return 503 '{"error":"Request could not be completed"}';
        }
        error_page 504 = @gateway_504;
        location @gateway_504 {
            default_type application/json;
            return 504 '{"error":"Request could not be completed"}';
        }
        location = /api/health/store-a {
            proxy_next_upstream off;
            proxy_pass http://store_a_probe/healthz;
        }
        location = /api/health/store-b {
            proxy_next_upstream off;
            proxy_pass http://store_b_probe/healthz;
        }
        location = /api/quote {
            limit_req zone=quotes burst=20 nodelay;
            proxy_pass http://stores;
        }
        location / {
            proxy_pass http://stores;
        }
    }
}
