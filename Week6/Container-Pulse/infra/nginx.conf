worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 5s;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    upstream pulse_backends {
        zone pulse_backends 64k;
        server app:3000 resolve;
    }

    # Literal outputs and case-sensitive anchored matches: never reflect arbitrary origins.
    map $http_origin $pulse_cors_origin {
        default "";
        ~^https://chernichenkodmitriy[.]com$ https://chernichenkodmitriy.com;
        ~^https://wild-resume-deployment[.]dmitriy-chernichenko[.]workers[.]dev$ https://wild-resume-deployment.dmitriy-chernichenko.workers.dev;
        ~^http://127[.]0[.]0[.]1:8788$ http://127.0.0.1:8788;
    }

    server {
        listen 8080;
        server_name _;
        # Empty map values omit ACAO for unknown origins; always covers error responses.
        add_header Access-Control-Allow-Origin $pulse_cors_origin always;
        add_header Vary Origin always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'none'" always;
        error_page 500 502 503 504 = @unavailable;

        location / {
            proxy_pass http://pulse_backends;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_buffering off;
            # Do not forward browser credentials or user-supplied proxy headers.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host container-pulse;
            proxy_set_header Connection close;
            proxy_set_header Content-Length '';
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
        }

        location @unavailable {
            default_type application/json;
            return 503 '{"error":"Service unavailable"}';
        }
    }
}
